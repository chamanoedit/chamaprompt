<title>CHAMAPROMPT for Seedance 2.5</title>
<style data-cadeado>
:root{--bg:#F5F5F7;--card:#FFFFFF;--field:#F1F1F4;--text:#1D1D1F;--text-2:#6E6E73;--accent:#CF4A00;--on-accent:#FFFFFF;--ring:rgba(207,74,0,.30);--bad:#C8102E;--shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000000;--card:#1C1C1E;--field:#2C2C2E;--text:#F5F5F7;--text-2:#A1A1A6;--accent:#FF8A3D;--on-accent:#1C0B00;--ring:rgba(255,138,61,.38);--bad:#FF453A;--shadow:0 0 0 1px rgba(255,255,255,.07);color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font:15px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:380px;background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:32px 26px 24px;text-align:center}
.logo{width:56px;height:56px;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
h1{font:800 23px/1.1 -apple-system,"SF Pro Display",BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.02em;margin:16px 0 2px}
.for{margin:0;color:var(--text-2);font-size:14px}
.sub{margin:16px auto 22px;color:var(--text-2);font-size:13.5px;max-width:30ch}
form{display:grid;gap:12px;text-align:left}
input[type=password]{width:100%;height:46px;border-radius:12px;border:1px solid transparent;background:var(--field);color:var(--text);font:inherit;font-size:16px;padding:0 14px;outline:none}
input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.rem{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-2);cursor:pointer}
.rem input{accent-color:var(--accent);width:16px;height:16px;margin:0}
button{height:46px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.msg{min-height:20px;margin:2px 0 0;font-size:13.5px;color:var(--bad);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
</style>
</head>
<body>
<main class="card" data-cadeado>
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
    <defs><linearGradient id="fl" x1="0.1" y1="1" x2="0.75" y2="0"><stop offset="0" stop-color="#FF375F"/><stop offset=".55" stop-color="#FF6B1A"/><stop offset="1" stop-color="#FFB340"/></linearGradient></defs>
    <rect width="32" height="32" rx="8" fill="url(#fl)"/>
    <path d="M16.6 6.2c.7 3.2-1.3 4.8-2.9 6.5-1.6 1.7-2.9 3.5-2.9 6 0 3.4 2.6 6.1 5.8 6.1s5.8-2.6 5.8-6c0-2.3-1.1-4.1-2.4-5.4.1 1.5-.4 2.8-1.6 3.4.4-3.8-.2-8.1-1.8-10.6z" fill="#fff"/>
  </svg>
  <h1>CHAMAPROMPT</h1>
  <p class="for">for Seedance 2.5</p>
  <p class="sub">Acesso da turma. A senha muda todo mês e chega pelo grupo do curso.</p>
  <form id="f">
    <label class="sr" for="pw">Senha da turma</label>
    <input id="pw" type="password" placeholder="Senha da turma" autocomplete="current-password" required>
    <label class="rem"><input id="rem" type="checkbox" checked> Lembrar neste navegador</label>
    <button id="go" type="submit">Entrar</button>
    <p id="msg" class="msg" role="alert"></p>
  </form>
</main>

      ocupado(false);
      msg.textContent = 'Senha errada ou vencida. A senha muda todo mês.';
      pw.select();
    });
  });
})();
</script>
